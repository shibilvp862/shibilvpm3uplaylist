name: Update My IPTV Playlist

on:
  workflow_dispatch:

  schedule:
    # Runs every 30 minutes
    - cron: "*/30 * * * *"

  push:
    paths:
      - "combine_playlist.py"
      - ".github/workflows/update-playlist.yml"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: |
          pip install requests

      - name: Generate combined playlist
        run: |
          python combine_playlist.py

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add My_IPTV.m3u

          if git diff --cached --quiet; then
            echo "No changes to My_IPTV.m3u"
          else
            git commit -m "Update My IPTV playlist"
            git push
          fi
